
name: Build Settings-iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find build scheme
        run: xcodebuild -list -project Preferences.xcodeproj

      - name: Build for simulator
        run: |
          xcodebuild \
            -project Preferences.xcodeproj \
            -scheme Preferences \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/*.app
