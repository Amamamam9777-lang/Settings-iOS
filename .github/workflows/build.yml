name: Build Settings-iOS for iPhone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build for iPhone
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild \
            -project Preferences.xcodeproj \
            -scheme Preferences \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          
          RESULT=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$RESULT"
          echo "===== ERROR SUMMARY ====="
          grep -n -i -E 'error:|fatal error:|failed frontend command|swift compiler error|signal [0-9]+' build.log | head -40 || true
          exit "$RESULT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Log
          path: build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Preferences.app Payload/
          /usr/bin/zip -qr Settings-iOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-iPhone
          path: Settings-iOS-unsigned.ipa
