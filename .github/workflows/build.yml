name: Build Settings-iOS for iPhone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project Preferences.xcodeproj \
            -scheme Preferences \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Preferences.app Payload/
          /usr/bin/zip -qr Settings-iOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-iPhone
          path: Settings-iOS-unsigned.ipa